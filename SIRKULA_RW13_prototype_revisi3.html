<!doctype html>
<html lang="id">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <meta name="theme-color" content="#6F8F3A" />
    <meta
      name="description"
      content="Layanan bank sampah dan partisipasi warga RW 13 untuk bank sampah, EcoPoints, kegiatan warga, produk, donasi dan pencatatan keuangan."
    />
    <title>SIRKULA RW13 · RW 13</title>
    <style>
      :root {
        --green: #6f8f3a;
        --green-deep: #496a22;
        --green-soft: #eaf3dd;
        --lime: #91ce2a;
        --lime-pale: #bcf162;
        --yellow: #ffdd00;
        --yellow-pale: #fff3a2;
        --orange: #ff8a00;
        --orange-pale: #ffd5a3;
        --brown: #71510a;
        --ink: #1f1f1f;
        --paper: #fff7f7;
        --white: #ffffff;
        --muted: #65695e;
        --line: #e3e5d8;
        --shadow: 0 10px 30px rgba(43, 60, 25, 0.08);
        --radius: 20px;
        --font-display: "Argent", Georgia, "Times New Roman", serif;
        --font-accent: "Symphony", "Segoe Script", cursive;
        --font-body:
          "Inter", system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI",
          sans-serif;
      }
      * {
        box-sizing: border-box;
      }
      html {
        scroll-behavior: smooth;
      }
      body {
        margin: 0;
        background: var(--paper);
        color: var(--ink);
        font-family: var(--font-body);
        font-size: 16px;
        line-height: 1.55;
        -webkit-font-smoothing: antialiased;
      }
      button,
      input,
      select,
      textarea {
        font: inherit;
      }
      button,
      select {
        cursor: pointer;
      }
      button:focus-visible,
      a:focus-visible,
      input:focus-visible,
      select:focus-visible,
      textarea:focus-visible {
        outline: 3px solid var(--yellow);
        outline-offset: 3px;
      }
      a {
        color: var(--green-deep);
      }
      .skip-link {
        position: absolute;
        left: -9999px;
        top: 8px;
        background: var(--white);
        padding: 10px 14px;
        z-index: 1000;
        border-radius: 10px;
      }
      .skip-link:focus {
        left: 8px;
      }
      .app-header {
        position: sticky;
        top: 0;
        z-index: 30;
        background: rgba(255, 247, 247, 0.96);
        backdrop-filter: blur(14px);
        border-bottom: 1px solid var(--line);
      }
      .header-inner {
        max-width: 1500px;
        margin: auto;
        display: flex;
        align-items: center;
        gap: 12px;
        padding: 12px 16px;
        min-height: 76px;
      }
      .brand {
        display: flex;
        align-items: center;
        gap: 10px;
        min-width: 0;
        text-decoration: none;
        color: var(--ink);
      }
      .brand img {
        width: 48px;
        height: 48px;
        object-fit: contain;
        border-radius: 14px;
        background: var(--paper);
        flex-shrink: 0;
      }
      .brand-copy {
        display: flex;
        flex-direction: column;
        line-height: 1.1;
      }
      .brand-name {
        font-family: var(--font-display);
        font-size: 23px;
        font-weight: 700;
        letter-spacing: -0.4px;
      }
      .brand-sub {
        font-size: 11px;
        color: var(--muted);
        letter-spacing: 0.08em;
        text-transform: uppercase;
        margin-top: 5px;
      }
      .header-spacer {
        flex: 1;
      }
      .demo-label {
        display: inline-flex;
        align-items: center;
        gap: 7px;
        background: var(--yellow-pale);
        color: var(--brown);
        font-size: 12px;
        font-weight: 800;
        padding: 7px 10px;
        border-radius: 999px;
        white-space: nowrap;
      }
      .demo-dot {
        height: 7px;
        width: 7px;
        border-radius: 99px;
        background: var(--orange);
      }
      .role-switch {
        display: flex;
        flex-direction: column;
        gap: 3px;
        min-width: 190px;
      }
      .role-switch label {
        font-size: 10px;
        font-weight: 800;
        color: var(--muted);
        letter-spacing: 0.08em;
        text-transform: uppercase;
      }
      .role-switch select {
        width: 100%;
        padding: 9px 32px 9px 11px;
        border: 1px solid var(--line);
        border-radius: 12px;
        background: var(--white);
        color: var(--ink);
        font-size: 13px;
        min-height: 42px;
      }
      .icon-button {
        height: 44px;
        width: 44px;
        border: 1px solid var(--line);
        border-radius: 14px;
        background: var(--white);
        color: var(--ink);
        display: inline-flex;
        align-items: center;
        justify-content: center;
        flex-shrink: 0;
      }
      .icon-button svg {
        width: 20px;
        height: 20px;
        stroke: currentColor;
      }
      .shell {
        max-width: 1500px;
        margin: 0 auto;
        display: grid;
        grid-template-columns: 250px minmax(0, 1fr);
        gap: 22px;
        padding: 22px 20px 90px;
      }
      .sidebar {
        align-self: start;
        position: sticky;
        top: 98px;
        max-height: calc(100vh - 115px);
        overflow: auto;
        padding: 10px;
        background: rgba(255, 255, 255, 0.75);
        border: 1px solid var(--line);
        border-radius: 22px;
      }
      .nav-group {
        margin: 0 0 17px;
      }
      .nav-group:last-child {
        margin-bottom: 0;
      }
      .nav-heading {
        font-size: 10px;
        font-weight: 900;
        letter-spacing: 0.12em;
        text-transform: uppercase;
        color: var(--muted);
        padding: 9px 10px 7px;
      }
      .nav-link {
        display: flex;
        align-items: center;
        gap: 10px;
        text-align: left;
        width: 100%;
        padding: 11px 10px;
        border: 0;
        border-radius: 12px;
        background: transparent;
        color: #3d4334;
        font-size: 14px;
        font-weight: 600;
        margin: 2px 0;
        min-height: 44px;
      }
      .nav-link svg {
        width: 18px;
        height: 18px;
        stroke: currentColor;
        flex-shrink: 0;
      }
      .nav-link:hover {
        background: var(--green-soft);
      }
      .nav-link.active {
        background: var(--green);
        color: #fff;
        font-weight: 800;
        box-shadow: 0 4px 12px rgba(73, 106, 34, 0.18);
      }
      .nav-link .nav-count {
        margin-left: auto;
        background: var(--yellow);
        color: var(--ink);
        font-size: 10px;
        padding: 2px 7px;
        border-radius: 99px;
        font-weight: 900;
      }
      .main-column {
        min-width: 0;
      }
      .demo-banner {
        display: flex;
        gap: 10px;
        align-items: flex-start;
        background: #fff6d1;
        border: 1px solid #f4d873;
        color: #5d4700;
        border-radius: 15px;
        padding: 12px 14px;
        margin-bottom: 18px;
        font-size: 13px;
      }
      .demo-banner strong {
        display: block;
        font-size: 13px;
        margin-bottom: 2px;
      }
      .demo-banner svg {
        width: 20px;
        height: 20px;
        flex-shrink: 0;
        margin-top: 1px;
        stroke: currentColor;
      }
      .page-header {
        display: flex;
        align-items: flex-start;
        justify-content: space-between;
        gap: 16px;
        margin: 4px 0 22px;
      }
      .eyebrow {
        color: var(--green-deep);
        text-transform: uppercase;
        letter-spacing: 0.11em;
        font-size: 11px;
        font-weight: 900;
        margin-bottom: 5px;
      }
      .page-title {
        font-family: var(--font-display);
        font-size: clamp(29px, 4vw, 42px);
        line-height: 1.12;
        letter-spacing: -0.7px;
        margin: 0;
        color: #26331a;
      }
      .page-subtitle {
        color: var(--muted);
        font-size: 15px;
        max-width: 760px;
        margin: 9px 0 0;
      }
      .page-actions {
        display: flex;
        gap: 8px;
        flex-wrap: wrap;
        justify-content: flex-end;
      }
      .grid {
        display: grid;
        gap: 15px;
      }
      .grid.two {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }
      .grid.three {
        grid-template-columns: repeat(3, minmax(0, 1fr));
      }
      .grid.four {
        grid-template-columns: repeat(4, minmax(0, 1fr));
      }
      .card {
        background: var(--white);
        border: 1px solid var(--line);
        border-radius: var(--radius);
        padding: 20px;
        box-shadow: 0 2px 7px rgba(40, 50, 28, 0.025);
        min-width: 0;
      }
      .card.no-pad {
        padding: 0;
        overflow: hidden;
      }
      .card-head {
        display: flex;
        justify-content: space-between;
        align-items: flex-start;
        gap: 12px;
        margin-bottom: 14px;
      }
      .card-title {
        font-size: 17px;
        line-height: 1.3;
        margin: 0;
        font-weight: 850;
        letter-spacing: -0.2px;
      }
      .card-subtitle {
        margin: 5px 0 0;
        color: var(--muted);
        font-size: 13px;
      }
      .section-title {
        font-family: var(--font-display);
        font-size: 26px;
        margin: 28px 0 13px;
        line-height: 1.2;
        color: #26331a;
      }
      .muted {
        color: var(--muted);
      }
      .small {
        font-size: 12px;
      }
      .tiny {
        font-size: 11px;
      }
      .strong {
        font-weight: 850;
      }
      .gap-top {
        margin-top: 18px;
      }
      .no-margin {
        margin: 0;
      }
      .text-right {
        text-align: right;
      }
      .align-end {
        align-items: flex-end;
      }
      .divider {
        height: 1px;
        background: var(--line);
        margin: 16px 0;
      }
      .stack {
        display: flex;
        flex-direction: column;
        gap: 12px;
      }
      .row {
        display: flex;
        align-items: center;
        gap: 10px;
        flex-wrap: wrap;
      }
      .row.between {
        justify-content: space-between;
      }
      .row.end {
        justify-content: flex-end;
      }
      .row.start {
        align-items: flex-start;
      }
      .grow {
        flex: 1;
        min-width: 0;
      }
      .hero {
        background: linear-gradient(
          125deg,
          #edf6e1 0%,
          #ffffff 60%,
          #fff7f7 100%
        );
        border: 1px solid #d7e8c1;
        border-radius: 26px;
        padding: 26px;
        position: relative;
        overflow: hidden;
      }
      .hero:after {
        content: "";
        position: absolute;
        width: 210px;
        height: 210px;
        border-radius: 50%;
        right: -70px;
        top: -75px;
        background: rgba(188, 241, 98, 0.25);
        pointer-events: none;
      }
      .hero-inner {
        position: relative;
        z-index: 1;
        display: grid;
        grid-template-columns: minmax(0, 1.4fr) minmax(210px, 0.7fr);
        gap: 20px;
        align-items: center;
      }
      .hero h2 {
        font-family: var(--font-display);
        font-size: clamp(28px, 3vw, 40px);
        line-height: 1.12;
        margin: 0;
        max-width: 620px;
        color: #26331a;
      }
      .hero p {
        max-width: 630px;
        color: #51594a;
        margin: 12px 0 18px;
        font-size: 15px;
      }
      .hero-mark {
        width: 100%;
        max-width: 225px;
        justify-self: end;
        opacity: 0.95;
      }
      .btn {
        border: 1px solid transparent;
        border-radius: 13px;
        min-height: 46px;
        padding: 11px 15px;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 8px;
        font-size: 14px;
        font-weight: 800;
        line-height: 1.2;
        text-decoration: none;
        transition:
          transform 0.12s ease,
          background 0.12s ease;
        white-space: normal;
        text-align: center;
      }
      .btn:active {
        transform: translateY(1px);
      }
      .btn svg {
        width: 17px;
        height: 17px;
        stroke: currentColor;
        flex-shrink: 0;
      }
      .btn.primary {
        background: var(--green);
        color: #fff;
        box-shadow: 0 4px 10px rgba(73, 106, 34, 0.13);
      }
      .btn.primary:hover {
        background: var(--green-deep);
      }
      .btn.secondary {
        background: var(--green-soft);
        color: var(--green-deep);
        border-color: #d5e4c4;
      }
      .btn.outline {
        background: var(--white);
        border-color: #cbd6bc;
        color: var(--green-deep);
      }
      .btn.ghost {
        background: transparent;
        color: var(--green-deep);
        border-color: transparent;
      }
      .btn.warning {
        background: var(--yellow);
        color: #342900;
      }
      .btn.danger {
        background: #fbeae6;
        color: #812b1c;
        border-color: #edc4ba;
      }
      .btn.dark {
        background: var(--ink);
        color: #fff;
      }
      .btn:disabled {
        opacity: 0.45;
        cursor: not-allowed;
        box-shadow: none;
      }
      .btn.block {
        width: 100%;
      }
      .btn.small-btn {
        min-height: 36px;
        padding: 8px 10px;
        font-size: 12px;
        border-radius: 10px;
      }
      .kpi {
        padding: 18px;
        min-height: 130px;
        position: relative;
      }
      .kpi-icon {
        height: 38px;
        width: 38px;
        border-radius: 13px;
        background: var(--green-soft);
        display: flex;
        align-items: center;
        justify-content: center;
        margin-bottom: 15px;
        color: var(--green-deep);
      }
      .kpi-icon svg {
        width: 20px;
        height: 20px;
        stroke: currentColor;
      }
      .kpi-value {
        font-family: var(--font-display);
        font-size: clamp(25px, 3vw, 34px);
        font-weight: 800;
        letter-spacing: -0.5px;
        line-height: 1.1;
      }
      .kpi-label {
        font-size: 12px;
        color: var(--muted);
        font-weight: 700;
        margin-top: 7px;
      }
      .kpi-note {
        font-size: 11px;
        color: var(--muted);
        margin-top: 3px;
      }
      .badge {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        border-radius: 999px;
        padding: 5px 9px;
        font-size: 11px;
        line-height: 1.25;
        font-weight: 850;
        white-space: normal;
        border: 1px solid transparent;
      }
      .badge:before {
        content: "";
        width: 6px;
        height: 6px;
        border-radius: 50%;
        background: currentColor;
        flex-shrink: 0;
      }
      .badge.success {
        background: #eaf5e5;
        color: #28662b;
        border-color: #cfe5c7;
      }
      .badge.pending {
        background: #fff3d4;
        color: #7a4e00;
        border-color: #f1d58c;
      }
      .badge.info {
        background: #e8f1d9;
        color: #486e25;
        border-color: #d0e1b8;
      }
      .badge.danger {
        background: #fbeae6;
        color: #8b2e1d;
        border-color: #ebc5bc;
      }
      .badge.neutral {
        background: #f0f1e9;
        color: #55594e;
        border-color: #e1e4d8;
      }
      .badge.donation {
        background: #fff4b7;
        color: #685000;
        border-color: #f3df72;
      }
      .badge.sim {
        background: #fff1de;
        color: #854b00;
        border-color: #ffd3a3;
      }
      .callout {
        display: flex;
        gap: 11px;
        padding: 14px 15px;
        border-radius: 15px;
        border: 1px solid var(--line);
        background: #fafbf6;
        font-size: 13px;
        color: #454b3d;
      }
      .callout svg {
        width: 20px;
        height: 20px;
        flex-shrink: 0;
        stroke: currentColor;
      }
      .callout.success {
        background: #eff7e9;
        border-color: #cfe5c7;
        color: #2d5d2e;
      }
      .callout.warning {
        background: #fff6d8;
        border-color: #f0d887;
        color: #6f4b00;
      }
      .callout.danger {
        background: #fff0ec;
        border-color: #edc4ba;
        color: #812b1c;
      }
      .callout strong {
        display: block;
        margin-bottom: 3px;
      }
      .callout p {
        margin: 0;
      }
      .form-grid {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 14px;
      }
      .field {
        display: flex;
        flex-direction: column;
        gap: 6px;
        min-width: 0;
      }
      .field.full {
        grid-column: 1/-1;
      }
      .field label,
      .field-label {
        font-size: 13px;
        font-weight: 800;
        color: #343b2b;
      }
      .required {
        color: #8c3a1c;
      }
      .field-hint {
        font-size: 11px;
        line-height: 1.4;
        color: var(--muted);
        overflow-wrap: anywhere;
        word-break: break-word;
        min-width: 0;
      }
      input,
      select,
      textarea {
        width: 100%;
        min-height: 46px;
        border: 1px solid #d7dccb;
        border-radius: 12px;
        background: #fff;
        color: var(--ink);
        padding: 10px 12px;
        font-size: 14px;
      }
      textarea {
        min-height: 94px;
        resize: vertical;
      }
      input::placeholder,
      textarea::placeholder {
        color: #96998f;
      }
      input[type="checkbox"],
      input[type="radio"] {
        width: 20px;
        height: 20px;
        min-height: 20px;
        accent-color: var(--green);
        flex-shrink: 0;
      }
      input[type="file"] {
        padding: 10px;
        height: auto;
        max-width: 100%;
        min-width: 0;
      }
      .checkline {
        display: flex;
        gap: 10px;
        align-items: flex-start;
        font-size: 13px;
        color: #414738;
      }
      .checkline label {
        font-weight: 600;
      }
      .form-actions {
        display: flex;
        flex-wrap: wrap;
        gap: 10px;
        margin-top: 18px;
        padding-top: 16px;
        border-top: 1px solid var(--line);
      }
      .form-footnote {
        font-size: 12px;
        color: var(--muted);
        margin-top: 10px;
      }
      .radio-card {
        display: flex;
        gap: 10px;
        align-items: flex-start;
        padding: 14px;
        border: 1px solid var(--line);
        border-radius: 14px;
        cursor: pointer;
        background: #fff;
      }
      .radio-card:has(input:checked) {
        border-color: var(--green);
        background: #f4f9ed;
        box-shadow: 0 0 0 2px rgba(111, 143, 58, 0.1);
      }
      .radio-card strong {
        display: block;
        font-size: 14px;
      }
      .radio-card p {
        margin: 4px 0 0;
        color: var(--muted);
        font-size: 12px;
      }
      .choice-grid {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 10px;
      }
      .table-wrap {
        overflow: auto;
        border: 1px solid var(--line);
        border-radius: 15px;
        background: #fff;
      }
      table {
        border-collapse: collapse;
        width: 100%;
        min-width: 650px;
        font-size: 13px;
      }
      th,
      td {
        text-align: left;
        padding: 12px 13px;
        border-bottom: 1px solid #eef0e8;
        vertical-align: top;
      }
      th {
        background: #f4f7ed;
        color: #3d4c2e;
        font-size: 11px;
        letter-spacing: 0.03em;
        text-transform: uppercase;
        font-weight: 900;
        position: sticky;
        top: 0;
      }
      tbody tr:last-child td {
        border-bottom: 0;
      }
      tbody tr:hover {
        background: #fcfdf9;
      }
      td .btn {
        margin: 2px 4px 2px 0;
      }
      .empty-state {
        text-align: center;
        padding: 30px 20px;
      }
      .empty-state .empty-icon {
        margin: auto auto 12px;
        width: 54px;
        height: 54px;
        border-radius: 18px;
        background: var(--green-soft);
        color: var(--green-deep);
        display: flex;
        align-items: center;
        justify-content: center;
      }
      .empty-state svg {
        width: 25px;
        height: 25px;
        stroke: currentColor;
      }
      .empty-state h3 {
        margin: 0 0 6px;
        font-family: var(--font-display);
        font-size: 23px;
      }
      .empty-state p {
        font-size: 13px;
        color: var(--muted);
        max-width: 420px;
        margin: 0 auto 15px;
      }
      .item-card {
        display: flex;
        flex-direction: column;
        gap: 12px;
      }
      .item-art {
        height: 135px;
        border-radius: 16px;
        background: linear-gradient(140deg, #eef7e3, #f9fbef);
        display: flex;
        align-items: center;
        justify-content: center;
        position: relative;
        overflow: hidden;
      }
      .item-art.orange {
        background: linear-gradient(140deg, #fff1d9, #ffe0bd);
      }
      .item-art.yellow {
        background: linear-gradient(140deg, #fff8d8, #fff0a4);
      }
      .item-art svg {
        width: 58px;
        height: 58px;
        stroke: var(--green-deep);
        stroke-width: 1.4;
      }
      .item-art span {
        font-size: 50px;
        line-height: 1;
      }
      .item-card h3 {
        margin: 0;
        font-size: 16px;
        line-height: 1.3;
      }

ass="card-subtitle">Perhitungan berubah mengikuti jenis, berat, dan pilihan warga.</p></div></div><div id="deposit-preview">${depositPreviewMarkup("pet_bening", 2, state.priceOfficial ? "Jual" : "Donasi")}</div></div><div class="callout ${state.priceOfficial ? "success" : "warning"}">${icon(state.priceOfficial ? "check" : "alert")}<div><strong>${state.priceOfficial ? "Tarif rupiah telah disahkan" : "Tarif rupiah belum disahkan RW"}</strong>${state.priceOfficial ? "Setoran Jual memakai harga beli yang berlaku." : "Setoran Jual belum tersedia. Untuk saat ini, pilih Donasi atau minta pengurus menetapkan tarif."}</div></div><div class="card"><h3 class="card-title">Aturan cepat</h3><div class="timeline gap-top"><div class="timeline-item"><h4>Berat harus aktual</h4><p>Tidak menggunakan estimasi berat dari warga.</p></div><div class="timeline-item"><h4>Material ditolak = tidak berpoin</h4><p>Catat alasan agar warga tahu apa yang perlu diperbaiki.</p></div><div class="timeline-item"><h4>Donasi tidak dibayar uang</h4><p>Bonus poin tidak boleh ditafsirkan sebagai nominal rupiah.</p></div></div></div></div></div>`;

estination" id="out-destination"><option value="Pengepul">Dijual ke pengepul</option><option value="Produk">Dipakai untuk produk pemanfaatan</option><option value="Lainnya">Pemanfaatan lain sesuai kesepakatan</option></select></div><div class="field"><label for="out-name">Nama tujuan / mitra <span class="required">*</span></label><input id="out-name" name="destinationName" required placeholder="Nama pengepul/kelompok"></div><div class="field"><label for="out-amount">Nilai penerimaan (Rp)</label><input id="out-amount" name="amount" type="number" min="0" step="100" value="0"><div class="field-hint">Isi nilai transaksi jika material dijual. Jangan samakan dengan pembayaran warga.</div></div><div class="field"><label for="out-payment">Status uang diterima</label><select id="out-payment" name="paymentStatus"><option value="Not Received">Belum diterima</option><option value="Received">Sudah diterima (wajib bukti)</option></select></div><div class="field full"><label for="out-proof">Referensi bukti (wajib jika uang diterima)</label><input id="out-proof" name="proof" placeholder="Nomor kuitansi / nama file bukti"></div><div class="field full"><label for="out-note">Catatan (opsional)</label><textarea id="out-note" name="note" placeholder="Catatan penyaluran"></textarea></div></div><div class="form-actions"><button type="submit" class="btn primary">Catat material keluar</button></div></form></div></div><h2 class="section-title">Riwayat material keluar</h2><div class="card">${

      function availableProductStock(productId) {
        const p = state.products.find((x) => x.id === productId);
        if (!p) return 0;
        const reserved = state.orders
          .filter(
            (o) =>
              o.productId === productId &&
              [
                "Awaiting Seller",
                "Awaiting Buyer",
                "Held for Review",
                "Awaiting Finalization",
              ].includes(o.status),
          )
          .reduce((sum, o) => sum + Number(o.quantity || 1), 0);
        return Math.max(0, Number(p.stock || 0) - reserved);
      }
      function doOrderCompletion(order, options = {}) {
        if (!order || order.status === "Completed") return true;
        const prod = state.products.find((p) => p.id === order.productId);
        if (!prod) return false;
        const external = !!order.externalBuyer || !order.buyerId;
        if (external && !options.externalReviewed) {
          order.status = "Held for Review";
          order.heldReason =
            order.heldReason ||
            "Pembeli eksternal memerlukan pemeriksaan bukti";
          return false;
        }
        if (order.status === "Held for Review" && !options.externalReviewed)
          return false;
        if (!order.sellerConfirmed) return false;
        if (!external && !order.buyerConfirmed) {
          order.status = "Awaiting Buyer";
          return false;
        }
        const qty = Math.max(1, Number(order.quantity || 1));
        if (!Number.isFinite(qty) || qty > Number(prod.stock || 0)) {
          order.status = "Held for Review";
          order.heldReason = "Stok berubah atau tidak cukup saat penyelesaian";
          return false;
        }
        order.status = "Completed";
        order.completedAt = new Date().toISOString();
        prod.stock -= qty;
        if (order.buyerId) {
          addPoint(
            order.buyerId,
            30,
            `Membeli produk ${prod.name}`,
            order.id,
            "Transaksi produk selesai dan terverifikasi",
          );
        }
        if (order.sellerId)
          addPoint(
            order.sellerId,
            50,
            `Menjual produk ${prod.name}`,
            order.id,
            "Transaksi produk selesai dan terverifikasi",
          );
        audit(
          "Transaksi produk selesai",
          order.id,
          "",
          `stok ${prod.stock}; penjual/pembeli telah dikonfirmasi`,
          "Poin dihitung sekali setelah transaksi selesai",
        );
        saveState();
        return true;
      }
      function verifyDeposit(id) {
        const d = state.deposits.find((x) => x.id === id);
        if (
          !d ||
          !["Pending Verification", "Needs Correction"].includes(d.status)
        ) {
          toast(
            "Setoran tidak bisa diverifikasi",
            "Status setoran sudah berubah.",
            "warning",
          );
          return;
        }
        if (!canVerifyAgainstCreator(d.createdBy)) {
          toast(
            "Verifikasi ditolak",
            "Gunakan akun petugas lain yang berbeda dari pembuat transaksi.",
            "error",
          );
          return;
        }
        if (!d.residentChoiceConfirmed) {
          toast(
            "Konfirmasi warga belum ada",
            "Pilihan Jual atau Donasi harus dikonfirmasi sebelum setoran disahkan.",
            "error",
          );
          return;
        }
        if (d.type === "Jual" && !d.priceOfficialAtCreation) {
          toast(
            "Tarif belum disahkan",
            "Setoran Jual belum dapat disahkan. Tetapkan dan sahkan tarif, lalu catat ulang setoran dengan harga yang berlaku.",
            "warning",
          );
          return;
        }
        if (d.accepted) {
          d.status = "Verified";
          d.verifiedBy = currentAccountId;
          d.verifiedAt = new Date().toISOString();
          d.points = Math.round(
            Number(d.weight) *
              currentRate(
                d.material,
                d.type === "Donasi" ? "donatePts" : "sellPts",
              ),
          );
          if (
            d.residentId &&
            getUser(d.residentId) &&
            hasRole("Warga", getUser(d.residentId))
          )
            addPoint(
              d.residentId,
              d.points,
              `${d.type === "Donasi" ? "Donasi material" : "Setoran jual"}: ${MATERIAL_MAP[d.material]?.short || d.material} ${fmtNum(d.weight, 2)} kg`,
              d.id,
              "Setoran terverifikasi",
            );
          if (d.type === "Jual" && d.residentId) {
            state.payouts.push({
              id: makeId("PAY"),
              depositId: d.id,
              userId: d.residentId,
              amount: Number(d.amountRp || 0),
              status: "Awaiting Approval",
              createdBy: d.createdBy,
              approvedBy: null,
              paidBy: null,
              proof: "",
              createdAt: new Date().toISOString(),
            });
          }
          audit(
            "Verifikasi setoran",
            d.id,
            "Pending Verification",
            "Verified",
            `Diperiksa petugas berbeda; tipe ${d.type}; berat ${d.weight} kg`,
          );
          toast(
            "Setoran terverifikasi",
            "Stok dan EcoPoints telah diperbarui. Pembayaran jual dibuat sebagai antrean terpisah.",
          );
        } else {
          d.status = "Rejected";
          d.points = 0;
          d.amountRp = 0;
          audit(
            "Penolakan setoran",
            d.id,
            "Pending Verification",
            "Rejected",
            "Material tidak sesuai standar penerimaan",
          );
          toast(
            "Setoran ditolak",
            "Material tidak menambah stok, poin, atau hak pembayaran.",
            "warning",
          );
        }
        saveState();
        render();
      }

          toast(

      function registerEvent(eventId) {
        const u = currentUser();
        if (!isApprovedCitizen(u)) {
          showRegisterModal();
          return;
        }
        const e = state.events.find(
          (x) => x.id === eventId && x.status === "Published",
        );
        if (!e) {
          toast(
            "Kegiatan tidak tersedia",
            "Kegiatan mungkin sudah ditutup.",
            "warning",
          );
          return;
        }
        if (
          state.registrations.some(
            (r) =>
              r.eventId === eventId &&
              canonicalId(r.userId) === currentCitizenId() &&
              r.status !== "Cancelled",
          )
        ) {
          toast(
            "Anda sudah terdaftar",
            "Pendaftaran ganda untuk kegiatan yang sama tidak diperbolehkan.",
            "warning",
          );
          return;
        }
        const count = state.registrations.filter(
          (r) => r.eventId === eventId && r.status !== "Cancelled",
        ).length;
        if (e.quota && count >= e.quota) {
          toast(
            "Kuota penuh",
            "Pilih kegiatan lain atau hubungi pengelola.",
            "warning",
          );
          return;
        }
        state.registrations.push({
          id: makeId("REG"),
          eventId,
          userId: currentCitizenId(),
          status: "Registered",
          createdAt: new Date().toISOString(),
        });
        audit(
          "Pendaftaran kegiatan",
          eventId,
          "Belum terdaftar",
          "Registered",
          "Warga mendaftar melalui akun sendiri",
        );
        saveState();
        render();
        toast(
          "Pendaftaran berhasil",
          "Pendaftaran tersimpan. Poin baru diberikan setelah kehadiran diverifikasi.",
        );
      }
      function openEducation(materialId) {
        const m = state.educationMaterials.find(
          (x) => x.id === materialId && x.status === "Published",
        );
        if (!m) return;
        const completed = state.educationCompletions.some(
          (c) =>
            canonicalId(c.userId) === currentCitizenId() &&
            c.materialId === materialId,
        );
        openModal(
          m.title,
          `<span class="badge info">${esc(m.category)}</span><p class="small muted gap-top">Waktu baca ${esc(m.time)} · ${completed ? "Materi ini sudah pernah diselesaikan." : "30 EcoPoints sekali per materi berbeda."}</p><p>${esc(m.content)}</p><div class="card gap-top"><h3 class="card-title">Periksa pemahaman</h3><p class="small muted">Sebelum menandai selesai, pastikan Anda sudah memahami hal-hal berikut:</p><div class="stack gap-top">${m.check.map((c, i) => `<label class="checkline"><input type="checkbox" name="edu-check-${i}" class="edu-check"><span>${esc(c)}</span></label>`).join("")}</div></div><div class="modal-actions"><button class="btn outline" data-action="close-modal">Tutup</button>${completed ? `<button class="btn primary" disabled>Sudah mendapat poin</button>` : `<button class="btn primary" data-action="complete-education" data-id="${esc(materialId)}">Tandai selesai · +30 poin</button>`}</div>`,
        );

      function requestReward(rewardId) {
        const rw = state.rewards.find((x) => x.id === rewardId);
        if (!rw) return;
        const t = pointsTotals(currentCitizenId());
        const reserved = state.redemptions.filter(
          (r) => r.rewardId === rewardId && r.status === "Pending Pickup",
        ).length;
        const stock = rw.stock - reserved;
        if (t.available < rw.points) {
          toast(
            "Saldo poin belum cukup",
            `Reward ini membutuhkan ${rw.points} poin. Saldo yang dapat dipakai saat ini ${t.available}.`,
            "warning",
          );
          return;
        }
        if (stock <= 0) {
          toast(
            "Stok reward habis",
            "Hubungi pengelola untuk menanyakan ketersediaan.",
            "warning",
          );
          return;
        }
        confirmModal(
          "request-redemption",
          rewardId,
          "Tukar EcoPoints dengan reward?",
          `Anda akan memesan “${rw.name}” seharga ${rw.points} poin. Poin dan stok direservasi; saldo final berkurang setelah reward diserahkan.`,
        );
      }

              toast(
                "Pemulihan ditolak",
                "Hanya Superadmin dengan file backup yang valid dapat melanjutkan.",
                "error",
              );
              return;
            }
            const restored = pendingRestore;
            const required = [
              "users",
              "deposits",
              "pointLedger",
              "events",
              "products",
              "orders",
              "cashLedger",
              "payouts",
              "expenses",
              "audit",
            ];
            if (!required.every((k) => Array.isArray(restored[k]))) {
              toast(
                "Backup belum lengkap",
                "Snapshot tidak memiliki struktur yang diperlukan. Data saat ini tidak diubah.",
                "error",
              );
              pendingRestore = null;
              closeModal();
              return;
            }
            state = restored;
            currentAccountId = state.users.some(
              (x) => x.id === currentAccountId && x.status === "Active",
            )
              ? currentAccountId

      function csvEscape(value) {

      function downloadFile(name, content, type = "text/plain;charset=utf-8") {
        const blob = new Blob([content], { type });
        const url = URL.createObjectURL(blob);
        const a = document.createElement("a");
        a.href = url;
        a.download = name;
        document.body.appendChild(a);
        a.click();
        a.remove();
        setTimeout(() => URL.revokeObjectURL(url), 1000);
      }
      function copyText(text) {
        const fallback = () => {
          const ta = document.createElement("textarea");
          ta.value = text;
          ta.style.position = "fixed";
          ta.style.opacity = "0";
          document.body.appendChild(ta);
          ta.select();
          let ok = false;
          try {
            ok = document.execCommand("copy");
          } catch (e) {}
          ta.remove();
          if (ok) toast("Tersalin", `Teks “${text}” berhasil disalin.`);
          else
            showMessage(
              "Salin teks",
              `Silakan salin teks ini secara manual: ${text}`,
              "warning",
            );
        };
        if (navigator.clipboard && window.isSecureContext) {
          navigator.clipboard
            .writeText(text)
            .then(() => toast("Tersalin", `Teks “${text}” berhasil disalin.`))
            .catch(fallback);
        } else fallback();
      }

          if (form.dataset.form === "registration") {
            const email = v("email").toLowerCase();
            const fullName = v("name");
            const rawPhone = v("phone");
            const phone = rawPhone.replace(/[^0-9+]/g, "");
            const normalizedPhone = phone.replace(/\D/g, "");
            if (fullName.length < 3 || fullName.length > 150 || !v("houseNumber")) {
              toast("Data diri belum lengkap", "Isi nama lengkap dan nomor rumah sesuai kondisi sebenarnya.", "error");
              return;
            }
            if (!/^[0-9+()\-\s]{9,25}$/.test(rawPhone) || normalizedPhone.length < 9 || normalizedPhone.length > 15) {
              toast("Nomor HP belum valid", "Masukkan 9–15 angka. Contoh: 081234567890 atau +6281234567890.", "error");
              form.querySelector('[name="phone"]')?.focus();
              return;
            }
            if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) {

              form.querySelector('[name="email"]')?.focus();
              return;

              return;
            }

              return;
            }
            if (state.users.some((u) => String(u.email || "").trim().toLowerCase() === email)) {

              return;
            }
            if (state.users.some((u) => u.phone && String(u.phone).replace(/\D/g, "") === normalizedPhone)) {
              toast("Nomor HP sudah terdaftar", "Hubungi pengurus jika Anda sudah memiliki ID warga manual atau akun sebelumnya.", "error");
              return;
            }
            const id = makeId("PEND");

              id,
              code: "",

              email,
              emailVerifiedAt: null,
              phone,
              rt: v("rt"),
              houseNumber: v("houseNumber"),
              household: v("household"),
              password: v("password"),
              roles: ["Warga"],
              status: "Pending",
              loginEnabled: true,
              consentedAt: new Date().toISOString(),
              createdAt: new Date().toISOString(),
              displayName: fullName.split(" ")[0] + " " + (fullName.split(" ")[1]?.[0] || "") + ".",
            };
            state.users.push(user);
            audit("Pendaftaran akun warga", id, "", "Pending", `Pendaftaran mandiri; email ${email}; menunggu pemeriksaan pengurus`);

            loggedIn = false;
            page = "login";
            saveState();
            render();
            toast("Pendaftaran terkirim", "Data dan email Anda sudah tercatat di prototype. Akun bisa digunakan setelah pengurus memeriksa dan menyetujuinya.");
            return;
          }
          if (form.dataset.form === "login") {
            const identifier = v("identifier").toLowerCase();
            const digits = identifier.replace(/\D/g, "");
            const isEmail = identifier.includes("@");
            const user = state.users.find((u) => {
              if (!u.loginEnabled) return false;
              return isEmail
                ? String(u.email || "").trim().toLowerCase() === identifier
                : String(u.phone || "").replace(/\D/g, "") === digits && digits.length > 0;
            });
            if (!user) {
              toast("Akun tidak ditemukan", "Periksa kembali email atau nomor HP. Jika belum memiliki akun, silakan daftar sebagai warga.", "error");

              toast("Pendaftaran masih diperiksa", "Akun belum aktif. Silakan tunggu persetujuan pengurus RW 13.", "warning");

              toast("Data perlu dilengkapi", user.reviewNote || "Hubungi pengurus untuk mengetahui data yang perlu diperbaiki.", "warning");
              return;
            }
            if (user.status === "Rejected" || user.status === "rejected" || user.status !== "Active" && user.status !== "active") {
              toast("Akun belum dapat digunakan", "Hubungi pengurus RW 13 untuk memeriksa status akun.", "error");
              return;
            }
            const expected = user.password || "123456";

            const phone = v("phone").replace(/[^0-9+]/g, "");
            if (!email || !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) {
              toast("Email belum valid", "Masukkan alamat email aktif yang benar.", "error");
              return;
            }
            if (state.users.some((x) => x.id !== u.id && String(x.email || "").trim().toLowerCase() === email)) {
              toast("Email sudah digunakan", "Gunakan email lain atau hubungi pengurus untuk memeriksa akun yang sudah ada.", "error");
              return;
            }
            if (phone && state.users.some((x) => x.id !== u.id && String(x.phone || "").replace(/\D/g, "") === phone.replace(/\D/g, ""))) {
              toast("Nomor HP sudah digunakan", "Gunakan nomor HP lain atau hubungi pengurus.", "error");
              return;
            }
            const before = { name: u.name, email: u.email || null, phone: u.phone, household: u.household };
            u.name = v("name");
            u.email = email;
            if (email !== String(before.email || "").toLowerCase()) u.emailVerifiedAt = null;
            u.phone = phone;
            u.household = v("household");
            audit("Perubahan profil sendiri", u.id, before, { name: u.name, email: u.email, phone: u.phone, household: u.household }, "Email perlu diverifikasi ulang jika berubah");
            saveState();
            closeModal();
            render();
            toast("Profil diperbarui", "Data tersimpan. Email baru perlu diverifikasi pada aplikasi produksi.");
            return;
          }
          if (form.dataset.form === "manual-resident") {
            if (!hasRole("Operator Bank Sampah") && !hasRole("Superadmin"))
              return;
            const phone = v("phone").replace(/\s/g, "");
            if (
              phone &&
              state.users.some(
                (u) => u.phone && u.phone.replace(/\s/g, "") === phone,
              )
            ) {
              toast(
                "Nomor kontak sudah terdaftar",
                "Gunakan profil yang sudah ada.",
                "error",
              );
              return;
            }
            const name = v("name");
            if (
              state.users.some(
                (u) =>
                  hasRole("Warga", u) &&
                  u.name.toLowerCase() === name.toLowerCase(),
              )
            ) {
              toast(
                "Nama mungkin sudah terdaftar",
                "Periksa profil yang ada sebelum membuat ID baru.",
                "warning",
              );
              return;
            }
            const code = nextResidentCode();
            state.users.push({
              id: code,
              code,
              name,
              phone,
              rt: v("rt"),
              houseNumber: v("houseNumber"),
              household: v("household"),
              roles: ["Warga"],
              status: "Active",
              loginEnabled: false,
              createdAt: new Date().toISOString(),
              displayName:
                name.split(" ")[0] +
                " " +
                (name.split(" ")[1]?.[0] || "") +
                ".",
            });
            audit(
              "Pembuatan profil warga manual",
              code,
              "",
              "Active",
              "Profil dibuat oleh petugas",
            );
            saveState();
            render();
            toast(
              "ID warga berhasil dibuat",
              `ID ${code} siap digunakan untuk pencatatan manual.`,
            );
            return;
          }
          if (form.dataset.form === "create-product") {
            if (!hasRole("Pengelola Kegiatan") && !hasRole("Superadmin"))
              return;
            const price = Number(v("price")),
              stock = Number(v("stock"));
            if (
              price <= 0 ||
              stock < 0 ||
              !Number.isFinite(price) ||
              !Number.isFinite(stock)
            ) {
              toast(
                "Harga atau stok tidak valid",
                "Periksa kembali harga dan stok.",
                "error",
              );
              return;
            }
            const p = {
              id: makeId("PR"),
              name: v("name"),
              description: v("description"),
              price,
              stock,
              status: "Draft",
              createdBy: currentAccountId,
              sellerId: v("sellerId") || null,
              imageData:
                form.querySelector("#prod-photo")?.dataset.imageData || null,
              createdAt: new Date().toISOString(),
            };
            state.products.unshift(p);
            audit(
              "Pembuatan draft produk",
              p.id,
              "",
              "Draft",
              "Foto dan informasi produk disimpan; menunggu persetujuan",
            );
            saveState();
            render();
            toast(
              "Draft produk tersimpan",
              "Periksa foto, harga, stok, dan penjual sebelum mengajukan publikasi.",
            );
            return;
          }
          if (form.dataset.form === "create-event") {
            if (!hasRole("Pengelola Kegiatan") && !hasRole("Superadmin"))
              return;
            const event = {
              id: makeId("EV"),
              category: v("category"),
              title: v("title"),
              date: v("date"),
              time: v("time"),
              location: v("location"),
              quota: Number(v("quota") || 0),
              description: v("description"),
              points: 50,
              poster:
                document.getElementById("event-poster")?.dataset.imageData ||
                null,
              status: "Draft",
              createdBy: currentAccountId,
              createdAt: new Date().toISOString(),
            };
            state.events.unshift(event);
            audit(
              "Pembuatan draft kegiatan",
              event.id,
              "",
              "Draft",
              "Poster dan informasi kegiatan disimpan",
            );
            saveState();
            closeModal();
            render();
            toast(
              "Draft kegiatan tersimpan",
              "Ajukan untuk ditinjau sebelum ditayangkan kepada warga.",
            );
            return;
          }
          if (form.dataset.form === "login") {
            return oldHandleForm(form);
          }
          return oldHandleForm(form);
        };

        // Extend modal action handling for registration confirmation and cancellation.
        const oldHandleActionModal = window.handleActionModal;
        window.handleActionModal = function (data) {
          if (data.action === "register-event") {
            registerEvent(data.id);
            return;
          }
          if (data.action === "cancel-event") {
            const reg = state.registrations.find(
              (r) =>
                r.eventId === data.id &&
                canonicalId(r.userId) === currentCitizenId() &&
                r.status !== "Cancelled",
            );
            if (!reg) {
              closeModal();
              return;
            }
            reg.status = "Cancelled";
            reg.cancelledAt = new Date().toISOString();
            audit(
              "Pembatalan pendaftaran kegiatan",
              data.id,
              "Registered",
              "Cancelled",
              "Warga membatalkan melalui konfirmasi",
            );
            saveState();
            closeModal();
            render();
            toast("Pendaftaran dibatalkan", "Status peserta diperbarui.");
            return;
          }
          return oldHandleActionModal(data);
        };

        // Demo images stay in current browser memory; avoid overflowing localStorage. Production uploads originals to object storage.
        const originalSaveState = window.saveState;
        window.saveState = function () {
          const products = state.products.map((x) => ({
            x,
            imageData: x.imageData,
          }));
          const events = state.events.map((x) => ({ x, poster: x.poster }));
          state.products.forEach((x) => delete x.imageData);
          state.events.forEach((x) => delete x.poster);
          try {
            originalSaveState();
          } finally {
            products.forEach((v) => {
              if (v.imageData !== undefined) v.x.imageData = v.imageData;
            });
            events.forEach((v) => {
              if (v.poster !== undefined) v.x.poster = v.poster;
            });
          }
        };
        // Add a house number to existing demo residents only when missing; production must collect verified values.
        state.users.forEach((u) => {
          if (!u.houseNumber) u.houseNumber = "—";
        });
        // One pre-approved citizen account is reserved for hands-on prototype testing.
        const demoCitizen = state.users.find((u) => u.id === "W-001");
        if (demoCitizen) {
          demoCitizen.status = "Active";
          demoCitizen.loginEnabled = true;
          demoCitizen.password = "123456";
          demoCitizen.demoAccount = true;
          demoCitizen.houseNumber = "12A";
        }
        const demoEmails = {
          "W-001": "sari.wulandari@example.test",
          "W-002": "budi.santoso@example.test",
          "W-003": "diah.lestari@example.test",
          "OP-001": "rudi.operator@example.test",
          "OP-002": "yanti.operator@example.test",
          "PK-001": "maya.program@example.test",
          "PK-002": "nisa.program@example.test",
          "BEN-001": "lina.bendahara@example.test",
          "ADM-001": "admin.sirkula@example.test",
          "PEND-001": "rina.apriliyani@example.test",
          "PEND-002": "deni.kurniawan@example.test",
        };
        state.users.forEach((u) => {
          if (!u.email && demoEmails[u.id]) u.email = demoEmails[u.id];
          if (u.email === demoEmails[u.id] && !Object.prototype.hasOwnProperty.call(u, "emailVerifiedAt")) u.emailVerifiedAt = null;
        });
        saveState();
        document.addEventListener("click", function (e) {
          const button = e.target.closest("[data-fill-demo]");
          if (!button) return;
          const identifier = document.getElementById("login-identifier");
          const password = document.getElementById("login-password");
          if (identifier && password) {
            identifier.value = "sari.wulandari@example.test";
            password.value = "123456";
            password.focus();
          }
        });
        // Enhance visual hierarchy and responsive image treatment.
        const style = document.createElement("style");
        style.textContent = `
    .upload-preview{margin-top:10px;min-height:110px;border:1px dashed #aab5a4;border-radius:14px;background:#f7faf5;display:flex;align-items:center;justify-content:center;padding:10px;overflow:hidden}.upload-preview img{max-width:100%;max-height:240px;object-fit:contain;border-radius:10px}.product-photo{padding:0!important;overflow:hidden;background:#f4f7f1}.product-photo img{width:100%;height:190px;object-fit:cover;display:block}.event-poster{width:100%;height:190px;overflow:hidden;border-radius:14px;margin-bottom:14px;background:#f2f6ed}.event-poster img{width:100%;height:100%;object-fit:cover}.event-poster-placeholder{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;color:#52624e}.event-poster-placeholder svg{width:32px;height:32px}.podium-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}.podium-card{border:1px solid #e1e8dd;border-radius:18px;background:#fff;padding:22px;text-align:center;box-shadow:0 8px 22px rgba(30,50,25,.06)}.podium-1{background:linear-gradient(160deg,#fff9df,#fff);border-color:#e6cf79;transform:translateY(-8px)}.podium-medal{font-size:30px}.podium-rank{font-size:12px;font-weight:800;color:#65735f;margin-top:8px}.podium-card h3{margin:8px 0 4px}.podium-card p{color:#687566;margin:0 0 8px}.podium-card strong{color:#365d32}.home-event-poster{width:100%;height:120px;object-fit:cover;border-radius:12px;margin-bottom:10px}.event-card{display:flex;flex-direction:column}.event-card .gap-top{margin-top:auto}.public-section-head{max-width:760px;margin-bottom:22px}.public-section-head h1{margin:8px 0}.public-section-head p{color:#687566}.login-card .text-link{display:block}.login-card .gap-top{margin-top:12px}.demo-login-box{margin-top:20px;padding:16px;border:1px solid #d7e2cf;border-radius:16px;background:#f7faf4}.demo-login-head{display:grid;gap:6px;margin-bottom:12px}.demo-login-head strong{font-size:16px;color:#263c25}.demo-login-head p{font-size:12px;line-height:1.5;color:#65735f;margin:0}.demo-login-status{font-size:10px;font-weight:800;letter-spacing:.06em;color:#3e7137}.demo-login-credential{display:flex;justify-content:space-between;gap:12px;padding:8px 0;border-top:1px solid #e3eadf;font-size:13px}.demo-login-credential span{color:#697665}.demo-login-credential strong{font-variant-numeric:tabular-nums;color:#263c25}
    @media(max-width:700px){.podium-grid{grid-template-columns:1fr}.podium-1{transform:none}.event-poster{height:160px}.product-photo img{height:160px}}
  `;
        document.head.appendChild(style);
        const navigationStyle = document.createElement("style");
        navigationStyle.textContent = `
          .nav-group-collapsible{margin:0 0 10px;border:1px solid #e3e8dc;border-radius:14px;background:rgba(255,255,255,.64);overflow:hidden}
          .nav-group-toggle{list-style:none;display:flex;align-items:center;gap:9px;min-height:48px;padding:10px 11px;cursor:pointer;color:#394631;font-size:13px;font-weight:850}

          .tiny{font-size:12px}

          @media(max-width:820px){.nav-group-toggle{min-height:50px}.nav-group-items .nav-link{min-height:44px}}
        `;
        document.head.appendChild(navigationStyle);
      })();
      // First render; all UX extensions are now active. Demonstration state stays in this browser only.
      render();
    </script>
  </body>
